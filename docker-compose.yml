version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsaquest
      POSTGRES_PASSWORD: dsaquest
      POSTGRES_DB: dsaquest
    ports:
      - '5432:5432'
    volumes:
      - dsaquest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dsaquest']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://dsaquest:dsaquest@db:5432/dsaquest?schema=public

  # Optional: fully self-hosted, properly sandboxed code execution.
  # Start with: docker compose --profile judge0 up
  # Then set JUDGE0_API_URL=http://localhost:2358 in your .env.
  # NOTE: this is a minimal sketch. Judge0 needs privileged containers and
  # specific cgroup/seccomp host configuration to sandbox safely — for a
  # real deployment, follow Judge0's own docker-compose at
  # https://github.com/judge0/judge0/blob/master/CHANGELOG.md#deployment
  # (or just use the hosted RapidAPI option in .env.example instead).
  judge0-server:
    image: judge0/judge0:1.13.1
    profiles: ['judge0']
    privileged: true
    restart: unless-stopped
    ports:
      - '2358:2358'
    environment:
      REDIS_HOST: judge0-redis
      POSTGRES_HOST: judge0-db
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:16-alpine
    profiles: ['judge0']
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0
    volumes:
      - judge0_pgdata:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    profiles: ['judge0']

volumes:
  dsaquest_pgdata:
  judge0_pgdata:
